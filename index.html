<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f1e8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1b18" media="(prefers-color-scheme: dark)" />
  <title>Recettes des Mim's</title>
  <script>
    // Apparence choisie dans Réglages (clair / sombre forcé), posée AVANT la feuille de style :
    // sinon l'app s'afficherait une fraction de seconde dans le thème du téléphone. (app.js, apparence)
    try { var th = localStorage.getItem("mims_theme"); if (th === "clair" || th === "sombre") document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css?v=39" />
  <!-- Écran d'accueil : Android/Chrome via le manifeste, iPhone via les balises apple-* -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mim's" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <!-- Le titre « Chez les Mim's » est dessiné en tête de chaque onglet (app.js, enTete) ;
       ce bandeau ne porte plus que l'état du partage, et disparaît quand il est vide. -->
  <header class="haut"><span id="sync-etat" class="sync-etat"></span></header>

  <main>
    <section id="view-semaine" class="view active"></section>
    <section id="view-courses" class="view"></section>
    <section id="view-recettes" class="view"></section>
    <section id="view-historique" class="view"></section>
    <section id="view-reglages" class="view"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="semaine"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Semaine</span></button>
    <button class="tab" data-view="courses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.3 10.6c.1.5.6.9 1.2.9h8.6c.6 0 1-.4 1.2-.9L20 8H6"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><span>Courses</span></button>
    <button class="tab" data-view="recettes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19.5V5.5A2.5 2.5 0 0 1 7.5 3H19v14H7.5A2.5 2.5 0 0 0 5 19.5 2.5 2.5 0 0 0 7.5 22H19"/></svg><span>Recettes</span></button>
    <button class="tab" data-view="historique"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Historique</span></button>
    <button class="tab" data-view="reglages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Réglages</span></button>
  </nav>

  <!-- Le numéro après « ?v= » change à chaque version : pour le navigateur c'est une
       ADRESSE différente, donc il ne peut pas servir une ancienne copie en cache.
       C'est la seule méthode fiable — « réseau d'abord » ne suffit pas, GitHub Pages
       répondant Cache-Control: max-age=600. À incrémenter avec VERSION_APP dans app.js. -->
  <script src="data.js?v=39"></script>
  <script src="app.js?v=39"></script>
  <script src="sync.js?v=39"></script>
  <script>
    // Hors-ligne : uniquement en https (GitHub Pages) ou en local, jamais en file://
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      // Quand une nouvelle version est publiée, le service worker se met à jour tout seul,
      // MAIS la page continue d'exécuter l'ancien code déjà chargé en mémoire — sur une app
      // installée sur l'écran d'accueil, elle n'est quasiment jamais rechargée, donc la
      // nouveauté n'arrivait jamais. On recharge donc une fois, dès que la nouvelle version
      // prend le contrôle. Le garde-fou évite toute boucle de rechargement.
      // On ne recharge QUE s'il s'agit d'une vraie mise à jour. À la toute première
      // installation, la page passe aussi de « sans contrôleur » à « contrôlée » : recharger
      // là serait un rechargement surprise pour quelqu'un qui ouvre l'app pour la 1re fois.
      var dejaControlee = !!navigator.serviceWorker.controller;
      var dejaRecharge = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!dejaControlee || dejaRecharge) return;
        dejaRecharge = true;
        location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          // on revérifie à chaque retour sur l'app : c'est le moment naturel pour découvrir
          // une mise à jour publiée pendant qu'elle était en arrière-plan.
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) reg.update().catch(() => {});
          });
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
