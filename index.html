<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b5651d" />
  <title>Recettes des Mim's</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Écran d'accueil : Android/Chrome via le manifeste, iPhone via les balises apple-* -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mim's" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <header><h1>🍲 Recettes des Mim's</h1></header>

  <main>
    <section id="view-semaine" class="view active"></section>
    <section id="view-courses" class="view"></section>
    <section id="view-recettes" class="view"></section>
    <section id="view-historique" class="view"></section>
    <section id="view-reglages" class="view"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="semaine">📅<span>Semaine</span></button>
    <button class="tab" data-view="courses">🛒<span>Courses</span></button>
    <button class="tab" data-view="recettes">📖<span>Recettes</span></button>
    <button class="tab" data-view="historique">🕑<span>Historique</span></button>
    <button class="tab" data-view="reglages">⚙️<span>Réglages</span></button>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Hors-ligne : uniquement en https (GitHub Pages) ou en local, jamais en file://
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
